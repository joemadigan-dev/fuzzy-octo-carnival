<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">MARKET DASHBOARD</div>
    <div class="status">
      <span id="market-state" class="market-state">--</span>
      <span id="last-updated" class="last-updated">awaiting data</span>
      <span id="connection" class="connection ok">live</span>
    </div>
  </header>
  <main id="grid" class="grid" aria-live="polite"></main>
  <footer class="footer">
    <span id="symbol-count">0 symbols</span>
    <span class="legend">
      <span class="dot up"></span> up
      <span class="dot down"></span> down
      <span class="dot flat"></span> unchanged
    </span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
